[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mobipy"
version = "0.1.0"
description = "Python bindings for the Mobius2"
requires-python = ">=3.8"
dependencies = [
    "numpy",
    "pandas",
]

[tool.setuptools]
packages = ["mobipy"]
package-dir = {"mobipy" = "."}